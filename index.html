<!DOCTYPE html>
<!--
  Collateral Maker - a single-file, no-server tool for making print-ready cards, vouchers and certificates.
  To rebrand without rebuilding, edit the CONFIG block just below, save, and reload this page.
  Licence: MIT (see LICENSE). Bundled third-party code and fonts: see NOTICE.md and the LICENSES folder.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collateral Maker</title>
<script>
/* =====================================================================================================
   CONFIG - the one place to rebrand the Collateral Maker.
   -----------------------------------------------------------------------------------------------------
   Two ways to use it:
     1. Edit the values below directly in index.html (this block is at the top of the file), save, reload.
     2. Or edit src/config.js and run `node build.js` to rebuild index.html.
   Everything is optional: delete a line and the built-in default is used.
   ===================================================================================================== */
window.CONFIG = {

  /* --- Who you are ------------------------------------------------------------------------------- */
  brandName: "Your Brand",                 // appears on every piece, in the page title and in file names
  tagline: "Your tagline goes here",       // short line on the welcome postcard and the phone business card
  location: "Your City",                   // small capitals line on the card fronts. Use "" to leave it out
  website: "yourbrand.com",                // shown as text on the pieces. QR codes default to https://<website>
  appTitle: "Collateral Maker",            // the name shown at the top of the page
  storagePrefix: "collateral-maker",       // browser storage name. Change it if two copies are hosted on the same site

  /* --- Request tab --------------------------------------------------------------------------------- */
  requestEmail: "requests@example.com",    // "Email this request" opens the user's own email app, addressed here

  /* --- Gift card and voucher numbers --------------------------------------------------------------- */
  numberPrefixes: { voucher: "GV-", giftcard: "GC-" },   // numbers are suggested as GV-0001, GV-0002 ...

  /* --- Colours (any CSS hex colour) ---------------------------------------------------------------- */
  colors: {
    ink: "#2E3440",        // main text and dark backgrounds
    accent: "#6C7A89",     // secondary text, thin rules, small caps labels
    paper: "#F7F7F5",      // light background of the pieces and the page
    band: "#ECEDEA",       // soft bands and the footer strip
    highlight: "#B4A58B",  // small accent lines
    line: "#D5D8D6"        // hairlines and ruled writing lines
  },

  /* --- Fonts ----------------------------------------------------------------------------------------
     CSS font-family stacks. 'Abhaya Libre' (headings) and 'Noto Sans' (body) are bundled in index.html.
     Any other name only works if that font is installed on the viewer's device, so keep a fallback. */
  fonts: {
    heading: "'Abhaya Libre', Georgia, serif",
    body: "'Noto Sans', Arial, sans-serif"
  },

  /* --- Logo -----------------------------------------------------------------------------------------
     By default a simple text logo is drawn from brandName. To use your own, paste an inline SVG string
     ("<svg ...>...</svg>") or a data: URI. Do not use a file path: exports need the logo inside the file.
       onLight / symbolOnLight : the version that sits on light backgrounds (usually your dark logo)
       onDark  / symbolOnDark  : the version that sits on dark photos or colours (usually white)
     The symbol is the small mark used on card backs and the certificate seal.
     wordmarkRatio and symbolRatio are height divided by width of your artwork. */
  logo: {
    onLight: null, onDark: null, symbolOnLight: null, symbolOnDark: null,
    wordmarkRatio: 56 / 142, symbolRatio: 31 / 60
  },

  /* --- Picture backgrounds -------------------------------------------------------------------------
     The choices in the "Picture" dropdown. Each has an id, a label and EITHER a CSS `background`
     (a colour or gradient) OR a `src` (a data: URI or image URL). People can also upload their own photo
     in the app. Add as many as you like. */
  images: [
    { id: "sage",  label: "Sage",  background: "linear-gradient(135deg,#8E9A86,#5F6B58)" },
    { id: "dusk",  label: "Dusk",  background: "linear-gradient(135deg,#8A8FA3,#565B73)" },
    { id: "clay",  label: "Clay",  background: "linear-gradient(135deg,#B58E7A,#7F5A4A)" },
    { id: "stone", label: "Stone", background: "linear-gradient(135deg,#9C9A94,#66645F)" },
    { id: "sand",  label: "Sand",  background: "linear-gradient(135deg,#C2AE8C,#8E7A5A)" },
    { id: "ink",   label: "Charcoal", background: "linear-gradient(135deg,#4A4F58,#2B2E34)" }
  ],

  /* --- Background pattern on the footer strips: "dots", "lines" or "none" ------------------------- */
  pattern: "dots"
};
</script>
<style>:root{--ink:#2E3440;--gold:#6C7A89;--cream:#F7F7F5;--band:#ECEDEA;--mauve:#B4A58B;--line:#D5D8D6;--ok:#3f6b3a;--warn:#9a4b2a;--font-head:"Abhaya Libre",Georgia,serif;--font-body:"Noto Sans",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding:12px 24px 0;background:var(--band);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:14px;padding-bottom:10px}
.brand img{height:38px;display:block}
.tool{font-family:var(--font-head);font-weight:500;font-size:24px;letter-spacing:.02em;border-left:1px solid var(--mauve);padding-left:14px}
nav{display:flex;gap:2px;overflow-x:auto;max-width:100%}
.nav{font:inherit;font-weight:600;font-size:15px;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;color:var(--gold);cursor:pointer}
.nav[aria-current=page]{color:var(--ink);border-bottom-color:var(--mauve)}
.loading{padding:40px;text-align:center;color:var(--gold)}
.make{display:grid;grid-template-columns:minmax(340px,520px) minmax(0,1fr);gap:30px;padding:22px 24px 60px;max-width:1400px;margin:0 auto;align-items:start}
.lead{margin:0 0 14px;font-size:16px}
fieldset{border:1px solid var(--line);background:#fff;border-radius:6px;padding:14px 16px 14px;margin:0 0 16px;min-width:0}
legend{font-family:var(--font-head);font-weight:600;font-size:20px;letter-spacing:.04em;padding:0 8px}
.n{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:var(--ink);color:var(--cream);font-family:var(--font-body);font-size:13px;margin-right:6px}
label{display:block;font-weight:600;font-size:14px;margin:11px 0 4px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 11px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--mauve);outline-offset:1px}
textarea{resize:vertical}
.hint{margin:3px 0 0;font-size:13px;color:var(--gold)}
.checkrow{display:flex;align-items:center;gap:12px;margin:12px 0 2px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-weight:600}
.checkrow input{width:24px;height:24px;flex:none;accent-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:600;padding:10px 16px;border-radius:4px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--cream)}
.chip.ghost{border-color:var(--line);color:var(--gold)}
details.shared{margin:0 0 16px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:10px 16px}
details.shared summary{cursor:pointer;font-family:var(--font-head);font-weight:600;font-size:20px;letter-spacing:.04em}
.side{position:sticky;top:96px}
.stage{background:var(--band);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
.scaler{position:relative;box-shadow:0 4px 18px rgba(0,0,0,.22);background:#fff;flex:none}
.scaler iframe{border:0;position:absolute;left:0;top:0;transform-origin:0 0;background:#fff}
.size{font-size:13px;color:var(--gold);margin:8px 0 0}
.warnings p{margin:8px 0 0;padding:8px 12px;border-radius:4px;font-size:14px}
.warn{background:#f6e5dc;color:var(--warn)}.note{background:var(--band);color:var(--ink)}
.dl{display:grid;gap:8px;margin-top:14px}
.btn{font:inherit;font-weight:600;font-size:16px;padding:13px 16px;background:var(--ink);color:var(--cream);border:0;border-radius:4px;cursor:pointer;text-align:center}
.btn:hover{opacity:.88}.btn:disabled{opacity:.6;cursor:wait}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--ink)}.btn.sec:hover{background:var(--band)}
.dl .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.link{font:inherit;font-size:13px;background:none;border:0;color:var(--gold);text-decoration:underline;cursor:pointer;padding:6px 2px}
.status{font-size:14px;margin:8px 0 0;min-height:1.4em}.status.ok{color:var(--ok);font-weight:600}.status.warn{color:var(--warn)}.status.info{color:var(--gold)}
.endnote{font-size:13px;color:var(--gold);margin-top:10px}
@media (max-width:860px){
  .make{grid-template-columns:1fr;padding:14px 12px 50px;gap:14px}
  .side{position:static;order:-1}
  .top{padding:10px 12px 0}.tool{font-size:20px}.brand img{height:30px}
  .dl .two{grid-template-columns:1fr}
}
@media print{body>*{display:none!important}body>#printroot{display:block!important}}
.chip.ghost[aria-pressed=true]{background:var(--ink);color:var(--cream);border-color:var(--ink)}

input[type=date]{min-height:46px;-webkit-appearance:none;appearance:none;display:block}
input,select,textarea{min-height:46px}
.btn{min-height:50px}.chip{min-height:46px}.link{min-height:36px}
.btn.danger,.btn.sec.danger{color:var(--warn);border-color:var(--warn)}
.logview{max-width:980px;margin:0 auto;padding:22px 24px 60px}
.logview h2{font-family:var(--font-head);font-weight:500;font-size:32px;margin:0 0 6px}
.logbar{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}.logbar .btn{padding:12px 20px}
.loglist{display:grid;gap:12px}
.logrow{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:4px}
.lr-top .fmt{display:inline-block;margin-left:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--band);color:var(--gold);padding:2px 8px;border-radius:10px}
.lr-main{font-size:17px;word-break:break-word}.lr-sub{font-size:13px;color:var(--gold)}
.lr-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.lr-btns .btn{padding:10px 16px;min-height:46px}
html,body{overflow-x:hidden;max-width:100%}
.form,.side,.make>*{min-width:0}
@media (max-width:860px){
  nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;overflow:visible;padding-bottom:8px}
  .nav{white-space:normal;text-align:center;border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px 6px;font-size:14px;line-height:1.2;min-height:48px}
  .nav[aria-current=page]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .brand{padding-bottom:6px}
  .top{position:static}
  .btn{font-size:17px;min-height:54px}.chip{flex:1 1 auto;min-height:50px}
  .logview{padding:14px 12px 50px}
  .lr-btns .btn{flex:1 1 40%}
}
.qrinfo{overflow-wrap:anywhere}.qrurl{color:var(--ink);font-weight:600}.qrwarn{color:#9A5F58}.lr-qr{overflow-wrap:anywhere}
.sublabel{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}input[type=file]{padding:10px 11px;min-height:48px;background:#fff}
</style></head><body>
<header class="top"><div class="brand" id="brandbar"></div><nav id="nav"></nav></header>

  /**
   * @param unicodeData base64 string of byte array.

   * @param numChars

  qrcode.createStringToBytes = function(unicodeData, numChars) {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

        if (x.t === "date") return h + "<input type=\"date\" id=\"" + id + "\" data-r=\"" + x.k + "\" value=\"" + esc(v) + "\">";
        return h + "<input id=\"" + id + "\" data-r=\"" + x.k + "\" value=\"" + esc(v) + "\" placeholder=\"" + esc(x.ph) + "\" autocomplete=\"off\">";
      }).join("") +
      "<div class=\"dl\"><button class=\"btn\" data-reqmail=\"1\">Email this request</button><button class=\"btn sec\" data-reqcopy=\"1\">Copy the request text</button><button class=\"link\" data-reqclear=\"1\">Clear the form</button></div>" +
      "<p class=\"status\" id=\"status\" role=\"status\"></p><p class=\"endnote\">\"Email this request\" opens your own email app with the message ready, addressed to " + esc(REQ_TO) + ". Nothing is sent until you press send there.</p></fieldset></div>";
    status = $("#status");
  }
  function reqMail() {
    if (!String(reqVal("what")).trim()) { say("Please say what you need first.", "warn"); return; }
    var url = "mailto:" + REQ_TO + "?subject=" + encodeURIComponent("Collateral request: " + String(reqVal("what")).trim().slice(0, 80)) + "&body=" + encodeURIComponent(reqText());
    window.location.href = url; say("Your email app should open with the request. Press send there.", "ok");
  }
  function reqCopy() {
    var t = reqText();
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { say("Copied. Paste it into an email to " + REQ_TO + ".", "ok"); }, function () { say("Could not copy. Use \"Email this request\" instead.", "warn"); });
    else say("Could not copy on this browser. Use \"Email this request\" instead.", "warn");
  }

  /* ---------- log ---------- */
  function niceTs(t) { var d = new Date(t); return isNaN(d) ? "" : d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear() + ", " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  function drawLog() {
    var h = "<div class=\"logview\"><h2>Log</h2><p class=\"lead\">Every PDF and picture made on this device. The log lives in this browser only, so each computer or phone has its own.</p>";
    if (!log.length) h += "<p class=\"note logempty\">Nothing yet. Make a card and download it, and it appears here.</p>";
    else {
      h += "<div class=\"logbar\"><button class=\"btn\" data-logcsv=\"1\">Export CSV</button><button class=\"btn sec\" data-logclear=\"1\">Clear the whole log</button></div><div class=\"loglist\">";
      h += log.map(function (e) {
        return "<div class=\"logrow\"><div class=\"lr-top\"><b>" + esc(e.item) + "</b> <span class=\"fmt\">" + esc(e.format) + "</span></div>" +
          "<div class=\"lr-main\">" + esc([e.name, e.number].filter(Boolean).join(" · ") || e.details) + "</div>" +
          "<div class=\"lr-sub\">" + (e.name || e.number ? esc(e.details) + (e.details ? " · " : "") : "") + (e.valid ? "Valid until " + esc(e.valid) + " · " : "") + (e.qr ? "QR: <span class=\"lr-qr\">" + esc(e.qr) + "</span> · " : "") + "Made " + esc(niceTs(e.ts)) + "</div>" +
          "<div class=\"lr-btns\"><button class=\"btn sec\" data-open=\"" + e.id + "\">Open again</button><button class=\"btn sec danger\" data-rm=\"" + e.id + "\">Remove</button></div></div>";
      }).join("") + "</div>";
    }
    $app.innerHTML = h + "</div>";
  }
  function csvCell(v) { v = String(v == null ? "" : v); return /[",\n\r]/.test(v) ? "\"" + v.replace(/"/g, "\"\"") + "\"" : v; }
  function exportCsv() {
    var rows = [["Date created", "Item", "Format", "Name / recipient", "Number", "Details", "Valid until", "QR code link", "File name"]];
    log.slice().reverse().forEach(function (e) { rows.push([niceTs(e.ts), e.item, e.format, e.name, e.number, e.details, e.valid, e.qr || "", e.file]); });
    var csv = "\ufeff" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n") + "\r\n";
    save(new Blob([csv], { type: "text/csv" }), "collateral-log-" + today() + ".csv");
  }
  function openAgain(id) {
    var e = log.filter(function (x) { return x.id === id; })[0]; if (!e) return;
    Object.keys(e.snap).forEach(function (k) { store.data[canon(e.pk, k)] = e.snap[k]; });
    var ti = -1; TABS.forEach(function (t, i) { if (t.pieces && t.pieces.indexOf(e.pk) >= 0) { ti = i; store.variant[t.id] = t.pieces.indexOf(e.pk); } });
    if (ti >= 0) store.tab = ti; store.side = 0; saveStore(); drawNav(); drawShell(); window.scrollTo(0, 0); say("Opened again with the details from " + niceTs(e.ts) + ".", "ok");
  }

  /* ---------- events ---------- */
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.r) { store.data["req." + t.dataset.r] = t.value; saveStore(); return; }
    if (t.dataset && t.dataset.k) { var pk = pieceKey(); setRaw(pk, t.dataset.k, t.type === "checkbox" ? t.checked : t.value); update(); }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "photoFile" && t.files && t.files[0]) {
      var msg = $("#photoMsg"); if (msg) msg.textContent = "Reading the photo...";
      loadPhotoFile(t.files[0], function (url) {
        if (!url) { if (msg) msg.textContent = "That file could not be read as a picture."; return; }
        var kept = true; try { localStorage.setItem(IMGKEY, url); } catch (er) { kept = false; }
        setCustomPhoto(url); setRaw(pieceKey(), "photo", "custom"); drawFields(); update();
        var m2 = $("#photoMsg"); if (m2 && !kept) m2.textContent = "Used for now, but this browser has no room to remember it.";
      });
      return;
    }
     if (t.dataset && t.dataset.r) { store.data["req." + t.dataset.r] = t.value; saveStore(); return; } if (t.dataset && t.dataset.k && (t.tagName === "SELECT" || t.type === "date")) { setRaw(pieceKey(), t.dataset.k, t.value); update(); } });
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var d = b.dataset;
    if (d.tab != null) { store.tab = +d.tab; store.side = 0; saveStore(); drawNav(); drawShell(); window.scrollTo(0, 0); }
    else if (d.var != null) { store.variant[tab().id] = +d.var; store.side = 0; saveStore(); drawShell(); }
    else if (d.side != null) { store.side = +d.side; saveStore(); drawSides(); update(); }
    else if (d.go) go(d.go, d.s);
    else if (d.rmphoto) { try { localStorage.removeItem(IMGKEY); } catch (er) {} setCustomPhoto(null); Object.keys(store.data).forEach(function (k) { if (store.data[k] === "custom" && /photo$/.test(k)) delete store.data[k]; }); saveStore(); drawFields(); update(); }
    else if (d.blankdate) { setRaw(pieceKey(), d.blankdate, ""); $("#f_" + d.blankdate).value = ""; update(); }
    else if (d.today) { var pk = pieceKey(), v = d.today === "valid" ? plusMonths(12) : today(); setRaw(pk, d.today, v); $("#f_" + d.today).value = v; update(); }
    else if (d.usenext) { var pk2 = pieceKey(), n = NUMS[pk2]; setRaw(pk2, n.k, nextNumber(pk2)); $("#f_" + n.k).value = nextNumber(pk2); update(); }
    else if (b.id === "hand") { var pk3 = pieceKey(); M.HANDWRITE[pk3].forEach(function (k) { setRaw(pk3, k, ""); }); drawFields(); update(); say("Those fields will print as blank lines.", "info"); }
    else if (b.id === "reset") { if (!window.confirm("Put this card's words back to the starting text? Shared details such as the name will reset on the other cards too.")) return; var pk4 = pieceKey(); allFields(pk4).forEach(function (x) { delete store.data[canon(pk4, x.k)]; }); saveStore(); drawShell(); }
    else if (d.reqmail) reqMail();
    else if (d.reqcopy) reqCopy();
    else if (d.reqclear) { Object.keys(store.data).forEach(function (k) { if (k.indexOf("req.") === 0) delete store.data[k]; }); saveStore(); drawRequest(); }
    else if (d.logcsv) exportCsv();
    else if (d.logclear) { if (window.confirm("Remove every entry from the log? The files you already downloaded are not affected.")) { log = []; saveLog(); drawNav(); drawLog(); } }
    else if (d.open) openAgain(d.open);
    else if (d.rm) { log = log.filter(function (x) { return x.id !== d.rm; }); saveLog(); drawNav(); drawLog(); }
  });
  window.addEventListener("resize", function () { if (frame && !tab().log && !tab().request) update(); });
  var q = (location.hash || "").replace("#", ""); TABS.forEach(function (t, i) { if (t.id === q) store.tab = i; });
  if (store.tab >= TABS.length) store.tab = 0;
  drawNav(); drawShell();
  window.MAKER = { store: store, go: go, renderCanvas: renderCanvas, TABS: TABS, getLog: function () { return log; }, nextNumber: nextNumber, fmtVals: fmtVals };
})();
</script></body></html>
